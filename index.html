<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Bomba</title>

<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at 20% 20%, #1e2a4a, #0b1220 70%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  color: white;

  overflow-y: auto;
  overflow-x: hidden;
}

  input {
  padding: 5px;
  border-radius: 8px;
  border: none;
  margin-top: 5px;
}

.card {
  width: 400px;
  padding: 25px;
  margin: 20px 0;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(18px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.datetime {
  font-size: 12px;
  opacity: 0.7;
}

h1 {
  margin: 5px 0 15px 0;
  font-size: 20px;
  opacity: 0.9;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 10px 0;
}

.subtext {
  font-size: 12px;
  opacity: 0.7;
}

.led {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: red;
  box-shadow: 0 0 10px red;
  transition: 0.3s;
}

.green {
  background: #00ff88;
  box-shadow: 0 0 15px #00ff88;
}

.red {
  background: #ff3b3b;
  box-shadow: 0 0 15px #ff3b3b;
}

.pulse {
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.25); }
  100% { transform: scale(1); }
}

.buttons {
  margin-top: 15px;
  display: flex;
  justify-content: space-between;
}

button {
  flex: 1;
  margin: 5px;
  padding: 10px;
  border-radius: 12px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  transition: 0.3s;
}

.on { background: #00c853; color: white; }
.off { background: #d50000; color: white; }

button:hover { transform: scale(1.05); }

canvas {
  margin-top: 15px;
  background: rgba(0,0,0,0.3);
  border-radius: 10px;
  padding: 5px;
}
  
#rssiBars{
  font-size:16px;
  margin-right:5px;
  letter-spacing:2px;
  color:#00ff88;
}







/* 🔹 INPUTS */
.inputs-row {
  gap: 10px;
}

.input-group {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.input-group label {
  font-size: 12px;
  opacity: 0.7;
  margin-bottom: 3px;
}

.input-group input {
  padding: 8px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 14px;
}

/* 🔹 BOTÓN GUARDAR */
.save-btn {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #00c853, #00e676);
  color: white;
  font-size: 14px;
  cursor: pointer;
  transition: 0.3s;
}

.save-btn:hover {
  transform: scale(1.05);
}

/* 🔹 BOTONES AUTO */
.buttons button {
  background: rgba(255,255,255,0.08);
  color: white;
  border-radius: 12px;
}

.buttons button:hover {
  background: rgba(255,255,255,0.15);
}


/* 🔹 BOTONES ACTIVOS */
.active-btn {
  background: #29b6f6 !important;
  box-shadow: 0 0 10px #29b6f6;
}

/* 🔹 INPUT ACTIVO */
.input-active {
  background: rgba(41, 182, 246, 0.2) !important;
  box-shadow: 0 0 8px #29b6f6;
}



/* 🔵 BOTÓN ACTIVO (AZUL FUERTE) */
.active-btn {
  background: #2196f3 !important;   /* azul fuerte */
  color: white !important;
  box-shadow: 0 0 15px #2196f3 !important;
  transform: scale(1.05);
}


/* 🔘 BOTÓN INACTIVO (GRIS) */
button {
  background: #555;
  color: white;
}



/* 🔒 BOTONES DESHABILITADOS */
.disabled-btn {
  opacity: 0.4;
  pointer-events: none;
  box-shadow: none !important;
}


  /* 🔵 INPUT CON VALOR */
.input-filled {
  background: rgba(41, 182, 246, 0.25) !important;
  box-shadow: 0 0 10px #29b6f6;
}


  
.rango-extra{
  margin-top:10px;
}
.rango-extra .inputs-row{
  margin-top:5px;
}

  
</style>

  
</head>

<body>

<div class="card">

  <div class="topbar">
    <div class="datetime" id="datetime"></div>
  </div>

  <h1>⚙ Panel de Control Bomba</h1>

  <div class="row">
    <div>
      Conectado a MQTT
      <div class="subtext">Latencia: <span id="latencyValue">--</span> ms</div>
    </div>
    <div id="mqttLed" class="led red"></div>
  </div>

  <div class="subtext">
   Señal LoRa: 
    <span id="rssiBars">▱▱▱▱▱</span>
    <span id="rssiValue">--</span> dBm
  </div>

  <div class="row">
    <div>
      Control bomba: <span id="bombaEstado">OFF</span>
      <div class="subtext">Tiempo encendida: <span id="onTime">00:00:00</span></div>
    </div>
    <div id="bombaLed" class="led red"></div>
  </div>

  <div class="buttons">
    <button id="onBtn" class="on" onclick="encender()">Encender</button>
    <button id="offBtn" class="off" onclick="apagar()">Apagar</button>
  </div>

<div class="buttons">
<button id="autoOnBtn" onclick="activarAuto()">Horario</button>
<button id="autoOffBtn" onclick="desactivarAuto()">Manual</button>
</div>
  
  <!-- AQUÍ VA EL HORARIO -->
<div class="row inputs-row">

  <div class="input-group">
    <label>Hora Encendido</label>
    <input type="time" id="horaOn" onchange="verificarInputHorario()">
  </div>

  <div class="input-group">
    <label>Hora Apagado</label>
   <input type="time" id="horaOff" onchange="verificarInputHorario()">
  </div>

</div>


  <div id="rangosExtras"></div>

<button class="save-btn" onclick="agregarRango()">
  ➕ Agregar Rango
</button>
  

<button class="save-btn" onclick="enviarHorario()">
  💾 Guardar Horario
</button>

 <!-- GRÁFICA --> 
  <canvas id="estadoChart" height="120"></canvas>

</div>

<script>

const options = {
  username: "esp32",
  password: "Loquesea123",
  reconnectPeriod: 2000
};

const client = mqtt.connect("wss://4681e769df664e0daab26f3bdd7b3a70.s1.eu.hivemq.cloud:8884/mqtt", options);

const mqttLed = document.getElementById("mqttLed");
const bombaLed = document.getElementById("bombaLed");
const bombaEstado = document.getElementById("bombaEstado");
const latencyValue = document.getElementById("latencyValue");
const onTimeDisplay = document.getElementById("onTime");

  

 // Variables para guardar el tiempo de encendido de la bomba. 
let pingTime;
let startOnTime = null;
let inicioBomba = 0;

let modoAutomaticoUI = true;


function updateClock() {
  const now = new Date();
  document.getElementById("datetime").innerText =
    now.toLocaleDateString() + " " + now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

// 🔄 Restaurar modo AUTO / MANUAL
let modoGuardado = localStorage.getItem("modoAutomatico");

if (modoGuardado !== null) {
  modoAutomaticoUI = (modoGuardado === "true");
}

// 🔄 Restaurar estado ON/OFF
let estadoGuardado = localStorage.getItem("estadoManual");

// Aplicar UI
if (modoAutomaticoUI) {
  setActiveButton("autoOnBtn");
} else {
  setActiveButton("autoOffBtn");

  if (estadoGuardado === "on") {
    setActiveButton("onBtn");
  } else if (estadoGuardado === "off") {
    setActiveButton("offBtn");
  }
}

// Aplicar bloqueo visual
actualizarModoUI();

  

// 🔄 Restaurar todos los horarios al abrir la aplicación
window.addEventListener("load", () => {

  cargarHorariosGuardados();

  verificarInputHorario();

});
  

function updateOnTime() {
  if (inicioBomba > 0) {
    const ahora = Math.floor(Date.now() / 1000);
    const diff = ahora - inicioBomba;
    const h = String(Math.floor(diff / 3600)).padStart(2, '0');
    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
    const s = String(diff % 60).padStart(2, '0');

    onTimeDisplay.innerText = `${h}:${m}:${s}`;
  }
}
  
setInterval(updateOnTime, 1000);

const ctx = document.getElementById('estadoChart').getContext('2d');

const estadoChart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [{
      label: 'Estado Bomba (1=ON, 0=OFF)',
      data: [],
      borderColor: '#00ff88',
      tension: 0.1
    }]
  },
  options: {
    scales: {
      y: { min: 0, max: 1 }
    }
  }
});

client.on("connect", function () {

  mqttLed.classList.remove("red");
  mqttLed.classList.add("green");

  // Ahora solo escuchamos UN topic
  client.subscribe("bomba/data");

});

client.on("close", function () {

  mqttLed.classList.remove("green");
  mqttLed.classList.add("red");

});

client.on("message", function (topic, message) {


  if (modoAutomaticoUI) {
  latencyValue.innerText = "Auto";
} else {
  if (pingTime) {
    latencyValue.innerText = Date.now() - pingTime;
  } else {
    latencyValue.innerText = "--";
  }
}
  
    

  if(topic === "bomba/data"){

    const data = JSON.parse(message.toString());

    const estado = data.estado;
    const rssi = data.rssi;
    const inicio = data.inicio;

    // Guardar el timestamp de encendido
    inicioBomba = inicio;

    document.getElementById("rssiValue").innerText = rssi;
    actualizarBarrasRSSI(rssi);

    const now = new Date().toLocaleTimeString();

    estadoChart.data.labels.push(now);
    estadoChart.data.datasets[0].data.push(estado === "ON" ? 1 : 0);

    if (estadoChart.data.labels.length > 20) {
      estadoChart.data.labels.shift();
      estadoChart.data.datasets[0].data.shift();
    }

    estadoChart.update();

    if (estado === "ON") {
    
      bombaLed.classList.remove("red");
      bombaLed.classList.add("green", "pulse");
      bombaEstado.innerText = "ON";
  } else {
      bombaLed.classList.remove("green", "pulse");
      bombaLed.classList.add("red");
      bombaEstado.innerText = "OFF";
    
      // Reiniciar tiempo
      inicioBomba = 0;
    
      onTimeDisplay.innerText = "00:00:00"; 
    }

  }

});

function encender() {

  pingTime = Date.now();
  client.publish("bomba/control", "ON");
  setActiveButton("onBtn");
  localStorage.setItem("estadoManual", "on");
}

function apagar() {

  pingTime = Date.now();
  client.publish("bomba/control", "OFF");
  setActiveButton("offBtn");
  localStorage.setItem("estadoManual", "off");
}

function activarAuto() {
  client.publish("bomba/modo", "AUTO_ON");
  modoAutomaticoUI = true;

  setActiveButton("autoOnBtn");
  actualizarModoUI();

  localStorage.setItem("modoAutomatico", "true");
}

function desactivarAuto() {
  client.publish("bomba/modo", "AUTO_OFF");
  modoAutomaticoUI = false;

  setActiveButton("autoOffBtn");
  actualizarModoUI();

  localStorage.setItem("modoAutomatico", "false");
}
  
function actualizarBarrasRSSI(rssi){

  let bars = 1;

  if(rssi > -70) bars = 5;
  else if(rssi > -85) bars = 4;
  else if(rssi > -100) bars = 3;
  else if(rssi > -110) bars = 2;

  let visual = "";

  for(let i=0;i<5;i++){
    visual += i < bars ? "▰" : "▱";
  }

  document.getElementById("rssiBars").innerText = visual;

}

  


function enviarHorario() {

  const rangos = [];

  // RANGO 1
  const horaOn = document.getElementById("horaOn").value;
  const horaOff = document.getElementById("horaOff").value;

  if (horaOn && horaOff) {

    rangos.push({
      on: horaOn,
      off: horaOff
    });

  }

  // RANGOS EXTRA
  const horasOn =
    document.querySelectorAll(".horaOnExtra");

  const horasOff =
    document.querySelectorAll(".horaOffExtra");

  for (let i = 0; i < horasOn.length; i++) {

    if (
      horasOn[i].value &&
      horasOff[i].value
    ) {

      rangos.push({
        on: horasOn[i].value,
        off: horasOff[i].value
      });

    }

  }

if (rangos.length === 0) {
  alert("Debe ingresar al menos un horario");
  return;
}


// =====================================================
// VALIDACIÓN DE HORARIOS
// =====================================================

for (let i = 0; i < rangos.length; i++) {

  const inicio =
    rangos[i].on.split(":");

  const fin =
    rangos[i].off.split(":");

  const minutosInicio =
    parseInt(inicio[0]) * 60 +
    parseInt(inicio[1]);

  const minutosFin =
    parseInt(fin[0]) * 60 +
    parseInt(fin[1]);


  // 1️⃣ ENCENDIDO DEBE SER MENOR QUE APAGADO

  if (minutosInicio >= minutosFin) {

    alert(
      `⚠️ Error en el Rango ${i + 1}:\n\n` +
      `La hora de encendido debe ser menor ` +
      `que la hora de apagado.`
    );

    return;
  }


  // 2️⃣ COMPROBAR TRASLAPAMIENTO CON EL RANGO ANTERIOR

  if (i > 0) {

    const finAnterior =
      rangos[i - 1].off.split(":");

    const minutosFinAnterior =
      parseInt(finAnterior[0]) * 60 +
      parseInt(finAnterior[1]);


    if (minutosInicio < minutosFinAnterior) {

      alert(
        `⚠️ Los rangos se traslapan.\n\n` +
        `El Rango ${i} termina a las ` +
        `${rangos[i - 1].off}, pero el ` +
        `Rango ${i + 1} comienza a las ` +
        `${rangos[i].on}.\n\n` +
        `El Rango ${i + 1} debe comenzar ` +
        `a las ${rangos[i - 1].off} o después.`
      );

      return;
    }
  }
}


// =====================================================
// SI TODO ESTÁ CORRECTO, GUARDAR Y ENVIAR
// =====================================================

const data = {
  rangos: rangos
};

const json = JSON.stringify(data);

console.log("Horario guardado:");
console.log(json);

// 💾 Guardar en el navegador
localStorage.setItem("horariosBomba", json);

// 📡 Enviar al ESP32
client.publish("bomba/horario", json);

alert("✅ Horarios guardados correctamente.");

}
  

function setActiveButton(id) {

  // 🔵 GRUPO MANUAL (ON / OFF)
  if (id === "onBtn" || id === "offBtn") {

    const onBtn = document.getElementById("onBtn");
    const offBtn = document.getElementById("offBtn");

    if (onBtn) onBtn.classList.remove("active-btn");
    if (offBtn) offBtn.classList.remove("active-btn");

    const active = document.getElementById(id);
    if (active) active.classList.add("active-btn");
  }

  // 🟢 GRUPO AUTO (AUTO ON / OFF)
  if (id === "autoOnBtn" || id === "autoOffBtn") {

    const autoOn = document.getElementById("autoOnBtn");
    const autoOff = document.getElementById("autoOffBtn");

    if (autoOn) autoOn.classList.remove("active-btn");
    if (autoOff) autoOff.classList.remove("active-btn");

    const active = document.getElementById(id);
    if (active) active.classList.add("active-btn");
  }
}



  function activarInput(el) {
  el.classList.add("input-active");
}

function desactivarInput(el) {
  el.classList.remove("input-active");
}



function actualizarModoUI() {

  const onBtn = document.getElementById("onBtn");
  const offBtn = document.getElementById("offBtn");

  if (modoAutomaticoUI) {
    // 🔒 AUTO → deshabilitar ON/OFF
    if (onBtn) onBtn.classList.add("disabled-btn");
    if (offBtn) offBtn.classList.add("disabled-btn");
  } else {
    // 🔓 MANUAL → habilitar ON/OFF
    if (onBtn) onBtn.classList.remove("disabled-btn");
    if (offBtn) offBtn.classList.remove("disabled-btn");
  }
}


  


  
  function verificarInputHorario() {

  // RANGO 1
  const horaOn = document.getElementById("horaOn");
  const horaOff = document.getElementById("horaOff");

  if (horaOn && horaOn.value) {
    horaOn.classList.add("input-filled");
  } else if (horaOn) {
    horaOn.classList.remove("input-filled");
  }

  if (horaOff && horaOff.value) {
    horaOff.classList.add("input-filled");
  } else if (horaOff) {
    horaOff.classList.remove("input-filled");
  }

  // RANGOS EXTRA
  document.querySelectorAll(".horaOnExtra").forEach(input => {

    if (input.value) {
      input.classList.add("input-filled");
    } else {
      input.classList.remove("input-filled");
    }

  });

  document.querySelectorAll(".horaOffExtra").forEach(input => {

    if (input.value) {
      input.classList.add("input-filled");
    } else {
      input.classList.remove("input-filled");
    }

  });

}

  
let totalRangos = 1;

function agregarRango() {

  if(totalRangos >= 5){
    alert("Máximo 5 rangos");
    return;
  }

  totalRangos++;

  const contenedor =
    document.getElementById("rangosExtras");

  const nuevo =
    document.createElement("div");

  nuevo.className = "rango-extra";

  nuevo.innerHTML = `
    <div class="row inputs-row">

      <div class="input-group">
        <label>Hora Encendido ${totalRangos}</label>
        <input type="time"
          class="horaOnExtra"
          onchange="verificarInputHorario()">
      </div>

      <div class="input-group">
        <label>Hora Apagado ${totalRangos}</label>
        <input type="time"
          class="horaOffExtra"
          onchange="verificarInputHorario()">
      </div>

    </div>
  `;

  contenedor.appendChild(nuevo);
}


// ⬇️ PEGAR AQUÍ
function cargarHorariosGuardados() {

  const horariosGuardados =
    localStorage.getItem("horariosBomba");

  if (!horariosGuardados) {
    return;
  }

  try {

    const data =
      JSON.parse(horariosGuardados);

    if (!data.rangos || data.rangos.length === 0) {
      return;
    }

    const contenedor =
      document.getElementById("rangosExtras");

    contenedor.innerHTML = "";

    totalRangos = 1;

    // RANGO 1
    if (data.rangos[0]) {

      document.getElementById("horaOn").value =
        data.rangos[0].on;

      document.getElementById("horaOff").value =
        data.rangos[0].off;
    }

    // RANGOS 2, 3, 4 y 5
    for (let i = 1; i < data.rangos.length; i++) {

      agregarRango();

      const horasOn =
        document.querySelectorAll(".horaOnExtra");

      const horasOff =
        document.querySelectorAll(".horaOffExtra");

      const indice = horasOn.length - 1;

      horasOn[indice].value =
        data.rangos[i].on;

      horasOff[indice].value =
        data.rangos[i].off;
    }

    verificarInputHorario();

    console.log("Horarios restaurados:");
    console.log(data);

  } catch (error) {

    console.error(
      "Error al cargar horarios:",
      error
    );
  }
}
  
  

</script>
